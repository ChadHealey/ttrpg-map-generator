name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Python for deterministic glyph-pack verification
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'

      - name: Install glyph-pack converter
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r tools/glyph-pack/requirements.txt

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Verify deterministic fixtures
        run: pnpm test:cross-platform

      - name: Verify deterministic glyph-pack reproduction
        run: pnpm glyph-pack:check

      - name: Verify focused desktop workflows
        run: pnpm test:e2e

      - name: Verify reviewed visual evidence
        run: pnpm test:visual

      - name: Verify deterministic atlas PNG export
        run: pnpm test:png-export

      - name: Build production desktop frontend
        run: pnpm build

      - name: Record native recovery filesystem
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            RECOVERY_DEVICE="$(df -P "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $1 }')"
            test -n "$RECOVERY_DEVICE"
            RECOVERY_FILESYSTEM="$(
              diskutil info "$RECOVERY_DEVICE" |
                awk -F: '/File System Personality/ { value=$2; gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value }'
            )"
            [[ "$RECOVERY_FILESYSTEM" == APFS* ]]
          else
            RECOVERY_FILESYSTEM="$(stat -f -c %T "$GITHUB_WORKSPACE")"
            test -n "$RECOVERY_FILESYSTEM"
          fi
          echo "mapworld-native-filesystem=$RECOVERY_FILESYSTEM"

      - name: Verify native mapworld recovery
        run: pnpm test:native-recovery

  quality-gate:
    name: quality-gate
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
